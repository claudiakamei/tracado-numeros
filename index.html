<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Treino de traçado de números (1 a 10) e letras minúsculas e maiúsculas com caneta no tablet: exemplo animado da bolinha à estrelinha, aviso de sentido e ordem errados, nome falado e folha em tamanho menor.">
<meta name="theme-color" content="#1f6fb2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Traçado">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Traçado de Números 1 ~ 10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Comic+Neue:wght@700&family=Dancing+Script:wght@700&family=Nunito:wght@600;800&display=swap">
<style>
  /* Layout: uma tela só, como uma folha de exercício — modos no alto, folha no centro, botões grandes embaixo.
     Treino: um número grande por vez. Folha: do 1 ao 10 pequenos, lado a lado, como a folha de papel. */
  :root {
    --bg: #eef3f6;          /* mesa */
    --sheet: #ffffff;       /* folha */
    --fg: #1d2a33;
    --muted: #5d6f7b;
    --line: #cfd9df;
    --band: #e4e9ec;        /* faixa cinza do traçado */
    --dash: #8a99a3;
    --mark: #15212a;        /* bolinha e estrelinha */
    --accent: #1f6fb2;      /* azul do traço do aluno */
    --accent-ink: #ffffff;
    --demo: #f08a24;        /* laranja do exemplo */
    --ok: #1d9a52;
    --ok-soft: #dff3e7;
    --err: #d23a2f;
    --err-soft: #fbe3e1;
    --info-soft: #e3eef7;
    --star: #f5c518;
    --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
    --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11181d; --sheet: #1b252c; --fg: #e8eef2; --muted: #9db0bc; --line: #2f3d47;
      --band: #2a363f; --dash: #7f919c; --mark: #f1f5f8; --accent: #5aa7e8; --accent-ink: #0d1a24;
      --demo: #f59a3c; --ok: #4cc77f; --ok-soft: #173326; --err: #f0675c; --err-soft: #3a1c1a;
      --info-soft: #1a2b38; --star: #f5c518; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11181d; --sheet: #1b252c; --fg: #e8eef2; --muted: #9db0bc; --line: #2f3d47;
    --band: #2a363f; --dash: #7f919c; --mark: #f1f5f8; --accent: #5aa7e8; --accent-ink: #0d1a24;
    --demo: #f59a3c; --ok: #4cc77f; --ok-soft: #173326; --err: #f0675c; --err-soft: #3a1c1a;
    --info-soft: #1a2b38; --star: #f5c518; color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--font-body);
    display: flex; flex-direction: column; gap: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-top: max(12px, env(safe-area-inset-top, 0px)); padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
    user-select: none; -webkit-user-select: none; touch-action: manipulation; overflow: hidden;
  }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 12px; }
  h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.4rem, 3.2vw, 2.1rem); margin: 0; line-height: 1.1; text-wrap: balance; }
  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  button { font: inherit; color: inherit; cursor: pointer; border-radius: 16px; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .soft { background: var(--sheet); border: 2px solid var(--line); padding: 8px 14px; font-weight: 800; }
  .soft.warn { border-color: var(--err); color: var(--err); }
  .tabs { display: inline-flex; border: 2px solid var(--line); border-radius: 18px; background: var(--sheet); padding: 3px; gap: 3px; }
  .tabs button { border: 0; background: none; padding: 7px 14px; font-weight: 800; border-radius: 14px; }
  .tabs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .tabs button.ready { animation: chama 1.2s ease-in-out infinite; }
  @keyframes chama { 50% { box-shadow: 0 0 0 4px var(--star); } }
  .tabs small { font-weight: 600; font-size: 0.75rem; }
  nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  nav button {
    position: relative; min-width: 3.2rem; padding: 4px 12px; font-family: var(--font-display); font-weight: 800;
    font-size: clamp(1.4rem, 3vw, 1.9rem); line-height: 1.3; background: var(--sheet); border: 2px solid var(--line);
    font-variant-numeric: tabular-nums;
  }
  nav button[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  /* letras: botões menores, na mesma fonte da letra que o aluno traça */
  body.letras nav { gap: 6px; }
  body.letras nav button { font-family: "Comic Neue", "Comic Sans MS", cursive; font-weight: 700; min-width: 2.6rem; padding: 0 8px; font-size: clamp(1.3rem, 2.6vw, 1.7rem); }
  nav .badge {
    position: absolute; top: -9px; right: -9px; background: var(--star); color: #1d2a33; border-radius: 999px;
    font-family: var(--font-body); font-size: 0.72rem; padding: 1px 6px; line-height: 1.4;
  }
  #msg {
    text-align: center; font-weight: 800; font-size: clamp(1.05rem, 2.4vw, 1.4rem); padding: 10px 14px; border-radius: 16px;
    background: var(--info-soft); color: var(--fg); min-height: 1.5em;
  }
  #msg.err { background: var(--err-soft); color: var(--err); }
  #msg.ok { background: var(--ok-soft); color: var(--ok); }
  main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  svg#sheet {
    height: 100%; max-width: 100%; background: var(--sheet); border: 4px solid var(--line); border-radius: 24px;
    touch-action: none; display: block;
  }
  body.folha svg#sheet { border-radius: 10px; }
  svg#sheet.err { border-color: var(--err); }
  svg#sheet.ok { border-color: var(--ok); }
  footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; }
  footer button { padding: 12px 20px; font-size: 1.1rem; font-weight: 800; border: 2px solid var(--line); background: var(--sheet); }
  footer .demo { background: var(--demo); border-color: var(--demo); color: #fff; }
  footer .next { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .count { color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
  /* celular: cabeçalho e botões compactos e a fileira de letras numa faixa só, que rola para o lado,
     para sobrar espaço para a letra */
  @media (max-width: 640px), (max-height: 520px) {
    body { gap: 6px; padding-top: max(8px, env(safe-area-inset-top, 0px)); padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); }
    h1 { font-size: 1.15rem; }
    header { gap: 6px; }
    .tools { gap: 6px; }
    .soft { padding: 5px 9px; font-size: 0.85rem; }
    .tabs button { padding: 5px 9px; font-size: 0.85rem; }
    nav, body.letras nav { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; padding: 8px 2px 2px; gap: 6px; scrollbar-width: none; }
    nav button, body.letras nav button { flex: none; min-width: 2.4rem; padding: 0 8px; font-size: 1.25rem; }
    #msg { font-size: 0.95rem; padding: 6px 10px; }
    footer { gap: 6px; }
    footer button { padding: 8px 12px; font-size: 0.95rem; }
    .count { font-size: 0.8rem; }
    /* treino no celular: cabeçalho e botões numa linha só, para sobrar a tela para a letra */
    body:not(.home) h1 { display: none; }
    header .tools { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; width: 100%; padding-bottom: 2px; }
    header .tools > * { flex: none; }
    #foot-treino { flex-wrap: nowrap; }
    #foot-treino .lbl, #foot-treino .count { display: none; }
  }
  /* crédito discreto no canto, com a logo num fundo claro (a logo tem letras escuras) */
  .credit { align-self: flex-end; display: inline-flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--muted); text-decoration: none; margin-top: -4px; }
  .credit img { height: 28px; width: auto; background: #fff; border-radius: 6px; padding: 2px 5px; }
  /* tela inicial: cartões grandes e coloridos para escolher o que treinar e depois o modo */
  body.home nav, body.home #msg, body.home main, body.home footer, body.home .tabs, body.home #home-btn { display: none !important; }
  #home { flex: 1; min-height: 0; overflow: auto; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(14px, 3vh, 30px); padding: 10px 0; }
  .home-hello { position: relative; z-index: 1; margin: 0; text-align: center; font-family: var(--font-display); font-weight: 800; font-size: clamp(1.5rem, 4vw, 2.6rem); line-height: 1.15; }
  .home-grid { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(12px, 2.4vw, 26px); width: min(100%, 1000px); padding: 10px 6px; }
  @media (min-width: 900px) { #home-kinds { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  #home-modes { width: min(100%, 720px); }
  .card {
    position: relative; border: 0; border-radius: 28px; padding: clamp(16px, 3vw, 30px) 12px; color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    font-family: var(--font-display); box-shadow: 0 7px 0 rgba(0, 0, 0, 0.2); transition: transform 0.15s, box-shadow 0.15s;
  }
  .card:hover:not(:disabled) { transform: translateY(-4px) rotate(-1.5deg); }
  .card:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 3px 0 rgba(0, 0, 0, 0.2); }
  .c1 { background: #ef6239; } .c2 { background: #1f86cc; } .c3 { background: #16996a; } .c4 { background: #8a57cf; }
  .card .glyph {
    font-weight: 800; font-size: clamp(2.6rem, 7vw, 4.6rem); line-height: 1.05; padding: 0.12em 0.4em; border-radius: 22px;
    background: rgba(255, 255, 255, 0.22); animation: pula 2.4s ease-in-out infinite; white-space: nowrap;
  }
  .c2 .glyph { animation-delay: 0.3s; } .c3 .glyph { animation-delay: 0.6s; } .c4 .glyph { animation-delay: 0.9s; }
  .card .glyph.letra { font-family: "Comic Neue", "Comic Sans MS", cursive; font-weight: 700; }
  .card .glyph.cursiva { font-family: "Dancing Script", cursive; font-weight: 700; }
  .card .glyph.folha { font-size: clamp(1.8rem, 4.6vw, 3rem); letter-spacing: 0.08em; }
  .card .name { font-weight: 800; font-size: clamp(1.15rem, 2.4vw, 1.55rem); line-height: 1.15; text-align: center; }
  .card .sub { font-family: var(--font-body); font-weight: 700; font-size: clamp(0.85rem, 1.8vw, 1rem); opacity: 0.95; text-align: center; }
  .card:disabled { cursor: default; filter: saturate(0.5); opacity: 0.7; }
  .card .soon {
    position: absolute; top: -10px; right: -6px; transform: rotate(6deg); background: var(--star); color: #1d2a33;
    font-family: var(--font-body); font-weight: 800; font-size: 0.8rem; padding: 3px 10px; border-radius: 999px;
  }
  .back { grid-column: 1 / -1; justify-self: center; font-size: 1.05rem; padding: 10px 22px; }
  .home-deco { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .home-deco span { position: absolute; font-family: var(--font-display); font-weight: 800; opacity: 0.16; animation: flutua 7s ease-in-out infinite; }
  @keyframes pula { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes flutua { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-14px) rotate(8deg); } }
  @media (max-width: 640px), (max-height: 520px) {
    .card { border-radius: 22px; padding: 14px 8px; gap: 6px; }
    .card .glyph { font-size: 2.3rem; border-radius: 16px; }
    .card .glyph.folha { font-size: 1.6rem; }
    .card .name { font-size: 1.05rem; }
    .credit { font-size: 0.7rem; margin-top: -2px; }
    .credit img { height: 20px; }
  }
  @media (prefers-reduced-motion: reduce) { .card .glyph, .home-deco span { animation: none; } .card:hover:not(:disabled) { transform: none; } }
  @media (prefers-reduced-motion: reduce) { .pulse { display: none; } .tabs button.ready { animation: none; box-shadow: 0 0 0 3px var(--star); } }
</style>
</head>
<body>
<header>
  <h1 id="title">Traçado de Números 1 ~ 10</h1>
  <div class="tools">
    <button class="soft" id="home-btn">⌂ Início</button>
    <div class="tabs" role="group" aria-label="Modo">
      <button id="tab-treino" aria-pressed="true">Treino</button>
      <button id="tab-folha" aria-pressed="false">Folha 1 ao 10</button>
    </div>
    <div class="tabs" role="group" aria-label="Ajuda no traçado">
      <button id="lvl-ajuda" aria-pressed="true" aria-label="Com bolinha e estrelinha" title="Com bolinha e estrelinha">● ★</button>
      <button id="lvl-comeco" aria-pressed="false" aria-label="Só a bolinha do começo" title="Só a bolinha do começo">Só ●</button>
      <button id="lvl-livre" aria-pressed="false" aria-label="Livre, sem bolinha e sem estrelinha" title="Livre: sem bolinha e sem estrelinha">Livre</button>
    </div>
    <button class="soft" id="novo">Novo aluno</button>
    <button class="soft" id="voice-lang" aria-label="Idioma da voz">Voz: Português</button>
    <button class="soft" id="sound" aria-pressed="true">Som: ligado</button>
  </div>
</header>
<section id="home" hidden>
  <div class="home-deco" aria-hidden="true">
    <span style="left:4%;top:8%;font-size:3.2rem;color:var(--star)">★</span>
    <span style="right:6%;top:6%;font-size:3rem;color:#ef6239;animation-delay:1s">3</span>
    <span style="left:8%;bottom:10%;font-size:3.4rem;color:#1f86cc;animation-delay:2s">a</span>
    <span style="right:5%;bottom:14%;font-size:3rem;color:#16996a;animation-delay:3s">B</span>
    <span style="left:46%;top:2%;font-size:2rem;color:#8a57cf;animation-delay:1.5s">●</span>
    <span style="right:30%;bottom:3%;font-size:2.4rem;color:var(--star);animation-delay:2.5s">★</span>
  </div>
  <p class="home-hello" id="home-hello">Oba! O que vamos traçar hoje?</p>
  <div class="home-grid" id="home-kinds">
    <button class="card c1" data-kind="numeros"><span class="glyph">123</span><span class="name">Números</span></button>
    <button class="card c2" data-kind="letras"><span class="glyph letra">abc</span><span class="name">Letras minúsculas</span></button>
    <button class="card c3" data-kind="maiusculas"><span class="glyph letra">ABC</span><span class="name">Letras maiúsculas</span></button>
    <button class="card c4" disabled><span class="glyph cursiva">abc</span><span class="name">Letras cursivas</span><span class="soon">Em breve</span></button>
  </div>
  <div class="home-grid" id="home-modes" hidden>
    <button class="card c1" id="go-treino"><span class="glyph" id="treino-glyph">1</span><span class="name">Treino</span><span class="sub">um a um, com exemplo</span></button>
    <button class="card c2" id="go-folha"><span class="glyph folha" id="folha-glyph">1 2 3</span><span class="name" id="folha-name">Folha 1 ao 10</span><span class="sub">todos na mesma folha</span></button>
    <button class="soft back" id="home-back">← Voltar</button>
  </div>
</section>
<nav id="digits" aria-label="Escolher número"></nav>
<div id="msg" role="status">Veja o exemplo e depois faça você!</div>
<main><svg id="sheet" xmlns="http://www.w3.org/2000/svg" aria-label="Folha de traçado"></svg></main>
<footer id="foot-treino">
  <button id="prev" aria-label="Anterior">← <span class="lbl">Anterior</span></button>
  <button id="demo" class="demo">▶ <span class="lbl">Ver </span>exemplo</button>
  <button id="say" aria-label="Ouvir">🔊 <span class="lbl">Ouvir</span></button>
  <button id="clear">Apagar</button>
  <button id="next" class="next" aria-label="Próximo"><span class="lbl">Próximo </span>→</button>
  <span class="count" id="errors">Erros neste número: 0</span>
</footer>
<footer id="foot-folha" hidden>
  <button id="say-folha">🔊 Ouvir</button>
  <button id="page-prev" hidden>◀</button>
  <span class="count" id="page-label" hidden></span>
  <button id="page-next" hidden>▶</button>
  <button id="sheet-restart">Apagar a folha</button>
  <span class="count" id="sheet-count"></span>
</footer>
<div class="credit">
  <span>Desenvolvido por</span>
  <img src="icons/kamei-flow-logo.png" alt="Kamei Flow" width="360" height="153">
</div>

<script>
// ---------- caminhos e conferência ----------
// Cada número numa caixa de 100 x 140 (o 10 tem 180 de largura), da bolinha para a estrelinha.
const H = 140;
const BACK_LIMIT = 20, WINDOW_BACK = 60, WINDOW_AHEAD = 45, STEP = 4, END_SLACK = 18;
// Tolerâncias (em unidades do desenho): na folha os números são pequenos, então a margem é maior.
const TOL_TREINO = { start: 24, off: 32 };
const TOL_FOLHA = { start: 32, off: 42 };
const PATHS = [
  ["1", 100, ["M50 15 L50 125"]],
  ["2", 100, ["M22 45 C22 10, 80 8, 80 42 C80 62, 60 78, 20 125 L82 125"]],
  ["3", 100, ["M22 32 C30 8, 80 10, 76 38 C74 56, 60 62, 44 66 C58 70, 82 78, 80 100 C78 132, 28 135, 20 112"]],
  ["4", 100, ["M54 15 L16 92 L86 92", "M66 45 L66 128"]],
  ["5", 100, ["M28 18 L24 68 C40 55, 82 58, 80 95 C78 132, 30 132, 20 112", "M28 18 L80 18"]],
  ["6", 100, ["M74 18 C50 30, 20 60, 22 95 C24 125, 78 130, 78 98 C78 70, 35 68, 24 92"]],
  ["7", 100, ["M18 20 L82 20 L42 125"]],
  ["8", 100, ["M74 26 C66 8, 28 10, 28 34 C28 58, 72 62, 74 94 C76 128, 24 128, 26 94 C28 62, 70 58, 70 44"]],
  ["9", 100, ["M74 40 C72 12, 26 12, 26 42 C26 70, 74 72, 74 42 L74 125"]],
  ["10", 180, ["M40 15 L40 125", "M118 14 C95 14, 88 45, 88 70 C88 100, 98 125, 120 125 C142 125, 152 100, 152 70 C152 42, 146 16, 128 16"]],
];
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

function parsePath(d) {
  const tok = d.match(/[MLC]|-?\d+(?:\.\d+)?/g) || [];
  const out = []; let i = 0, cur = { x: 0, y: 0 }, cmd = "M";
  const num = () => Number(tok[i++]);
  while (i < tok.length) {
    if (/[MLC]/.test(tok[i])) cmd = tok[i++];
    if (cmd === "M" || cmd === "L") { cur = { x: num(), y: num() }; out.push(cur); cmd = "L"; }
    else {
      const p0 = cur, p1 = { x: num(), y: num() }, p2 = { x: num(), y: num() }, p3 = { x: num(), y: num() };
      for (let k = 1; k <= 40; k++) {
        const t = k / 40, u = 1 - t;
        out.push({
          x: u*u*u*p0.x + 3*u*u*t*p1.x + 3*u*t*t*p2.x + t*t*t*p3.x,
          y: u*u*u*p0.y + 3*u*u*t*p1.y + 3*u*t*t*p2.y + t*t*t*p3.y,
        });
      }
      cur = p3;
    }
  }
  return out;
}
function buildStroke(d) {
  const raw = parsePath(d), rawCum = [0];
  for (let k = 1; k < raw.length; k++) rawCum.push(rawCum[k-1] + dist(raw[k-1], raw[k]));
  const len = rawCum[rawCum.length - 1], n = Math.max(2, Math.round(len));
  const pts = [], cum = []; let j = 0;
  for (let k = 0; k <= n; k++) {
    const s = len * k / n;
    while (j < raw.length - 2 && rawCum[j+1] < s) j++;
    const a = raw[j], b = raw[j+1], seg = rawCum[j+1] - rawCum[j] || 1;
    const f = Math.min(1, Math.max(0, (s - rawCum[j]) / seg));
    pts.push({ x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f }); cum.push(s);
  }
  return { d, pts, cum, len };
}
const DIGITS = PATHS.map(([label, width, strokes]) => ({ label, x0: 0, width, height: H, strokes: strokes.map(buildStroke) }));

// Letras minúsculas: o desenho cinza é a própria fonte Comic Neue (Bold, tamanho 150, linha de base y=115,

  }
  d.strokes.forEach(st => {
    if (isTap(st)) return;
    if (!d.font) el("path", { d: st.d, ...ROUND, stroke: "var(--band)", "stroke-width": 22 }, g);
    el("path", { d: st.d, fill: "none", stroke: "var(--dash)", "stroke-width": 1.3, "stroke-dasharray": "3 3" }, g);
  });
  return () => d.strokes.forEach((st, k) => {
    if (livre()) return; // livre: sem bolinha, estrelinha e número do traço
    const a = startOf(st), b = endOf(st);
    const m = el("g", { "pointer-events": "none" }, g);
    if (k === activeStroke) {
      const c = el("circle", { class: "pulse", cx: a.x, cy: a.y, r: 9, fill: "none", stroke: "var(--ok)", "stroke-width": 2 }, m);
      el("animate", { attributeName: "r", values: "7;13;7", dur: "1.2s", repeatCount: "indefinite" }, c);
      el("animate", { attributeName: "opacity", values: "1;0.3;1", dur: "1.2s", repeatCount: "indefinite" }, c);
    }
    if (!isTap(st) && level === "ajuda") el("path", { d: starPath(b.x, b.y, 6.5), fill: "var(--mark)" }, m); // o pingo só tem a bolinha
    el("circle", { cx: a.x, cy: a.y, r: 4.5, fill: "var(--mark)" }, m);
    if (d.strokes.length > 1) {
      // bolinhas juntas (o 5; o a, d, g, q): o número do 2º traço vai para o outro lado
      const shared = d.strokes.slice(0, k).some(o => dist(startOf(o), a) < 14);
      const t = el("text", { x: a.x + (shared ? 4 : -11), y: a.y - 6, "font-size": 9, "font-weight": 800, fill: "var(--accent)", "font-family": "var(--font-body)" }, m);
      t.textContent = String(k + 1);
    }
  });
}

function drawInk(parent) {
  doneInk.flat().forEach(pts => el("polyline", { points: ptsAttr(pts), ...ROUND, stroke: "var(--ok)", "stroke-width": 6 }, parent));
  const inkColor = status === "error" ? "var(--err)" : status === "success" ? "var(--ok)" : "var(--accent)";
  ink.forEach(pts => el("polyline", { points: ptsAttr(pts), ...ROUND, stroke: inkColor, "stroke-width": 6 }, parent));
}

const waitingStart = () => status !== "demo" && status !== "success" && !(track && track.s > 0);

function render() {
  if (mode === "folha" && !layout) computeLayout(); // o cabeçalho precisa saber se a folha tem páginas
  renderHeader();
  svg.innerHTML = "";
  if (mode === "treino") renderTreino(); else renderFolha();
}

const PHONE = matchMedia("(max-width: 640px), (max-height: 520px)"); // o mesmo limite do CSS do celular
function renderTreino() {
  const d = G[digitIdx], pad = 14;
  svg.style.width = svg.style.height = "";
  // no celular o quadro corta o espaço vazio acima e abaixo da letra (o "a" não guarda lugar da haste do "b")
  let y0 = 0, y1 = d.height;
  if (PHONE.matches) {
    const ys = d.strokes.flatMap(st => st.pts.map(p => p.y));
    y0 = Math.max(0, Math.min(...ys) - 16); y1 = Math.min(d.height, Math.max(...ys) + 16);
  }
  svg.setAttribute("viewBox", `${d.x0 - pad} ${y0 - pad} ${d.width - d.x0 + pad * 2} ${y1 - y0 + pad * 2}`);
  const g = el("g", {}, svg);
  const marks = drawGuides(g, d, waitingStart() ? strokeIdx : -1);
  if (demo) {
    d.strokes.slice(0, demo.stroke + 1).forEach((st, k) => {
      const pts = st.pts.slice(0, indexAt(st, k < demo.stroke ? st.len : demo.s) + 1);
      el("polyline", { points: ptsAttr(pts), ...ROUND, stroke: "var(--demo)", "stroke-width": 7 }, svg);
      if (k === demo.stroke) { const h = pts[pts.length - 1]; el("circle", { cx: h.x, cy: h.y, r: 7, fill: "var(--demo)", stroke: "var(--sheet)", "stroke-width": 2 }, svg); }
    });
  }
  drawInk(svg);
  marks();
}

// Folha: as células ficam lado a lado como na folha de papel, quebrando em mais linhas se a tela for estreita.
const CELL_PAD = 10;
const cellW = d => d.width - d.x0 + CELL_PAD * 2;
function computeLayout() {
  const CELL_H = G[0].height + CELL_PAD * 2;
  const W = Math.max(200, mainEl.clientWidth - 8), Hh = Math.max(150, mainEl.clientHeight - 8);
  const all = G.map((d, i) => i);
  const widthOf = idxs => idxs.reduce((s, i) => s + cellW(G[i]), 0);
  const rowsFor = (limit, idxs) => {
    const rows = [[]]; let x = 0;
    idxs.forEach(i => {
      if (x + cellW(G[i]) > limit && rows[rows.length - 1].length) { rows.push([]); x = 0; }
      rows[rows.length - 1].push(i); x += cellW(G[i]);
    });
    return rows;
  };
  // equilibra as linhas (evita uma linha cheia e outra com um número só)
  const balanced = (limit, idxs) => {
    let rows = rowsFor(limit, idxs);
    for (let lim = widthOf(idxs) / rows.length; lim <= limit; lim += 10) {
      const r = rowsFor(lim, idxs);
      if (r.length <= rows.length) { rows = r; break; }
    }
    return rows;
  };
  // px por unidade: o número fica com ~105px de altura, perto do tamanho da folha de papel.
  // Nunca diminui abaixo de K_MIN (no celular as letras ficariam minúsculas): se não couber, a folha vira páginas.
  const K_MIN = 0.55;
  let k = 0.75, rows;
  for (;;) {
    rows = balanced(W / k, all);
    if (rows.length * CELL_H * k <= Hh || k <= K_MIN + 1e-9) break;
    k = Math.max(K_MIN, k - 0.05);
  }
  // em páginas: reparte as letras em partes iguais por página (13 e 13, não 21 e 5) e só depois monta as linhas
  const fitRows = Math.max(1, Math.floor(Hh / (CELL_H * k)));
  let pageRows = [rows];
  if (rows.length > fitRows) {
    for (let P = Math.ceil(rows.length / fitRows); P <= G.length; P++) {
      const total = widthOf(all), chunks = [];
      let cur = [], acc = 0;
      all.forEach(i => {
        // fecha a página quando passar da sua parte da largura total (a última fica com o resto)
        if (cur.length && chunks.length < P - 1 && acc + cellW(G[i]) / 2 > total * (chunks.length + 1) / P) { chunks.push(cur); cur = []; }
        cur.push(i); acc += cellW(G[i]);
      });
      chunks.push(cur);
      pageRows = chunks.map(c => balanced(W / k, c));
      if (pageRows.every(r => r.length <= fitRows)) break;
    }
    rows = pageRows.flat();
  }
  // se a tela for estreita demais até para uma célula, encolhe só o necessário para caber na largura
  const widest = Math.max(...rows.map(row => row.reduce((s, i) => s + cellW(G[i]), 0)));
  k = Math.min(k, W / widest);
  const perPage = Math.max(...pageRows.map(r => r.length));
  const cells = []; let width = 0;
  pageRows.forEach((pr, pg) => pr.forEach((row, r) => {
    let x = 0;
    const y = r * CELL_H;
    row.forEach(i => {
      const w = cellW(G[i]);
      cells[i] = { x, y, w, h: CELL_H, ox: x + CELL_PAD - G[i].x0, oy: y + CELL_PAD, page: pg };
      x += w;
    });
    width = Math.max(width, x);
  }));
  const pages = pageRows.length;
  page = Math.min(page, pages - 1);
  layout = { k, cells, width, height: perPage * CELL_H, pages };
}

function renderFolha() {
  if (!layout) computeLayout();
  const { k, cells, width, height } = layout;
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
  svg.style.width = width * k + "px";
  svg.style.height = height * k + "px";
  let marks = [];
  G.forEach((d, i) => {
    const c = cells[i];
    if (c.page !== page) return; // outra página da folha
    if (i in sheetInk) el("rect", { x: c.x + 2, y: c.y + 2, width: c.w - 4, height: c.h - 4, rx: 8, fill: "var(--ok-soft)" }, svg);
    else if (i === digitIdx && status !== "success") el("rect", { x: c.x + 2, y: c.y + 2, width: c.w - 4, height: c.h - 4, rx: 8, fill: "var(--info-soft)" }, svg);
    el("rect", { x: c.x, y: c.y, width: c.w, height: c.h, fill: "none", stroke: "var(--line)", "stroke-width": 1.2 }, svg);
    const g = el("g", { transform: `translate(${c.ox} ${c.oy})` }, svg);
    marks.push(drawGuides(g, d, i === digitIdx && waitingStart() ? strokeIdx : -1));
  });
  // traços já terminados ficam guardados relativos à sua célula: continuam no lugar se a tela mudar de tamanho
  for (const i in sheetInk) {
    const c = cells[i];
    if (c.page !== page) continue;
    const g = el("g", { transform: `translate(${c.ox} ${c.oy})` }, svg);
    sheetInk[i].flat().forEach(pts => el("polyline", { points: ptsAttr(pts), ...ROUND, stroke: "var(--ok)", "stroke-width": 6 }, g));
  }
  drawInk(svg);
  marks.forEach(m => m());
}

// ----- controle -----
function clearTimers() {
  if (timer) clearTimeout(timer);
  if (raf) cancelAnimationFrame(raf);
  timer = raf = null;
}
function resetTrace() { track = null; pointerId = null; strokeIdx = 0; doneInk = []; ink = []; bridge = null; lifting = false; }

function startDemo() {
  if (mode !== "treino") return;
  clearTimers(); resetTrace();
  status = "demo"; setMsg("Olhe o caminho: da bolinha ● para a estrelinha ★");
  const d = G[digitIdx];
  if (sound) speak(d.label);
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
    demo = { stroke: d.strokes.length - 1, s: d.strokes[d.strokes.length - 1].len }; render();
    timer = setTimeout(endDemo, 1500); return;
  }
  let k = 0, s = 0, last = performance.now();
  const tick = now => {
    s += (now - last) / 1000 * DEMO_SPEED; last = now;
    if (s >= d.strokes[k].len) {
      if (k < d.strokes.length - 1) { k++; s = 0; }
      else { demo = { stroke: k, s: d.strokes[k].len }; render(); timer = setTimeout(endDemo, 700); return; }
    }
    demo = { stroke: k, s }; render();
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
}
function endDemo() { demo = null; status = "idle"; setMsg("Agora é sua vez! Comece na bolinha ●"); render(); }

// começo de cada número no treino: com exemplo animado, ou no livre só fala o nome
function startTurn() {
  if (!livre()) return startDemo();
  clearTimers(); resetTrace(); demo = null; status = "idle";
  const d = G[digitIdx];
  if (sound) speak(d.label);
  setMsg(`Agora sozinho! Faça ${T.the(d.label)}`); render();
}

function goTo(idx) {
  clearTimers(); errors = 0; demo = null;
  digitIdx = (idx + G.length) % G.length;
  renderNav(); startTurn();
}

function setMode(m) {
  clearTimers(); resetTrace(); demo = null; errors = 0; mode = m;
  if (m === "folha") {
    digitIdx = 0; sheetInk = {}; sheetCelebrated = false; layout = null; page = 0; status = "idle";
    setMsg(sheetText());
    render();
  } else {
    renderNav(); startTurn();
  }
}
const sheetText = () => `Agora sozinho! Escolha ${T.pick} da folha` + (livre() ? "" : " e comece na bolinha ●");

function startSheet() {
  clearTimers(); resetTrace(); errors = 0; digitIdx = 0; sheetInk = {}; sheetCelebrated = false; page = 0; status = "idle";
  setMsg(sheetText());
  render();
}

// troca o nível de ajuda: no treino recomeça o número; na folha os já feitos continuam
function setLevel(l) {
  if (l === level || pointerId !== null) return;
  level = l;
  try { localStorage.setItem(LEVEL_KEY, l); } catch {}
  if (mode === "treino") { errors = 0; startTurn(); return; }
  clearTimers(); resetTrace(); status = "idle"; setMsg(sheetText()); render();
}

// troca entre números e letras e entra no modo escolhido (treino ou folha)
function setKind(k, m = mode) {
  if (k !== kind) {
    kind = k; T = SETS[k]; G = T.G; digitIdx = 0; layout = null; page = 0;
    try { localStorage.setItem(KIND_KEY, k); } catch {}
  }
  setMode(m);
}

// ----- tela inicial -----
// passo 1: números, minúsculas, maiúsculas (cursiva em breve); passo 2: treino ou folha
const KIND_NAMES = { numeros: "Números", letras: "Letras minúsculas", maiusculas: "Letras maiúsculas" };
const inHome = () => document.body.classList.contains("home");
function showHome(step = "kinds") {
  clearTimers(); resetTrace(); demo = null; status = "idle";
  if (window.speechSynthesis) speechSynthesis.cancel();
  document.body.classList.add("home");
  $("home").hidden = false;
  $("home-kinds").hidden = step !== "kinds";
  $("home-modes").hidden = step !== "modes";
  const title = step === "kinds" ? "Traçado" : KIND_NAMES[kind];
  $("title").textContent = title; document.title = step === "kinds" ? "Traçado de Números e Letras" : T.title;
  if (step === "kinds") { $("home-hello").textContent = "Oba! O que vamos traçar hoje?"; return; }
  $("home-hello").textContent = "Como você quer treinar?";
  const first = G.slice(0, 3).map(d => d.label);
  $("treino-glyph").textContent = first[0];
  $("folha-glyph").textContent = first.join(" ") + " …";
  $("folha-name").textContent = T.folha;
  for (const id of ["treino-glyph", "folha-glyph"]) $(id).classList.toggle("letra", kind !== "numeros");
}
function leaveHome(m) {
  document.body.classList.remove("home");
  $("home").hidden = true;
  setKind(kind, m);
}
document.querySelectorAll("#home-kinds [data-kind]").forEach(b => b.onclick = () => {
  const k = b.dataset.kind;
  if (k !== kind) { kind = k; T = SETS[k]; G = T.G; digitIdx = 0; layout = null; page = 0; try { localStorage.setItem(KIND_KEY, k); } catch {} }
  showHome("modes");
});
$("go-treino").onclick = () => leaveHome("treino");
$("go-folha").onclick = () => leaveHome("folha");
$("home-back").onclick = () => showHome("kinds");
$("home-btn").onclick = () => { if (pointerId === null) showHome("kinds"); };

// ----- caneta -----
// no livre a criança não vê a bolinha: um pouco mais de folga para encostar perto do começo
const tol = () => {
  const t = mode === "folha" ? TOL_FOLHA : TOL_TREINO;
  return livre() ? { ...t, start: t.start + 8 } : t;
};
const offset = () => mode === "folha" ? layout.cells[digitIdx] : { ox: 0, oy: 0 };
const local = p => { const o = offset(); return { x: p.x - o.ox, y: p.y - o.oy }; };

function toSvg(e) {
  const m = svg.getScreenCTM();
  if (!m) return null;
  const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(m.inverse());
  return { x: p.x, y: p.y };
}
function cellAt(p) {
  if (!layout) return -1;
  return layout.cells.findIndex(c => c.page === page && p.x >= c.x && p.x <= c.x + c.w && p.y >= c.y && p.y <= c.y + c.h);
}

function retryText() {
  if (livre()) return "Tente de novo";
  const d = G[digitIdx], what = mode === "folha" ? ` do ${d.label}` : "";
  return d.strokes.length > 1 ? `Tente de novo: comece na bolinha ● do traço ${strokeIdx + 1}${what}` : `Tente de novo: comece na bolinha ●${what}`;
}

function fail(text) {
  track = null; pointerId = null; bridge = null; lifting = false; status = "error"; errors++;
  setMsg(livre() ? "Tente de novo" : text, "err"); beep("erro");
  try { navigator.vibrate && navigator.vibrate(150); } catch {}
  render(); clearTimers();
  timer = setTimeout(() => { ink = []; status = "idle"; setMsg(retryText()); render(); }, 1400);
}

svg.addEventListener("pointerdown", e => {
  if (e.pointerType === "pen") penSeen = true;
  if (e.pointerType === "touch" && penSeen) return; // palma da mão encostando
  if (pointerId !== null || status === "demo" || status === "error" || (status === "success" && mode === "treino")) return;
  const p = toSvg(e); if (!p) return;
  if (mode === "folha") {
    // na folha o aluno escolhe o número, em qualquer ordem, começando a traçar nele
    const hit = cellAt(p);
    if (hit < 0) return;
    if (hit in sheetInk) { delete sheetInk[hit]; digitIdx = hit; resetTrace(); } // número já feito: apaga e faz de novo
    else if (hit !== digitIdx) { digitIdx = hit; resetTrace(); } // o que tinha começado no outro número fica para depois
  }
  const d = G[digitIdx], st = d.strokes[strokeIdx], lp = local(p);
  const res = beginTrack(st, lp, track, tol());
  // traços que vêm depois e começam aqui também (no 5 os dois traços saem da mesma bolinha)
  const later = d.strokes.slice(strokeIdx + 1).filter(o => typeof beginTrack(o, lp, null, tol()) !== "string");
  // encostou mais perto da bolinha de um traço que vem depois (ex.: o pingo do i antes da perninha)
  const jumpedAhead = !(track && track.s > 0) && later.some(o =>
    dist(startOf(o), startOf(st)) >= 12 && dist(lp, startOf(o)) < dist(lp, startOf(st)));
  if (jumpedAhead) { ink.push([p]); fail(orderText()); return; }
  if (typeof res === "string") {
    ink.push([p]);
    fail(later.length && res !== "fora-do-ponto" ? orderText() : ERROR_TEXT[res]);
    return;
  }
  // acompanha em paralelo os traços seguintes: se o aluno for por um deles, a ordem está errada
  shadows = res.s === 0 ? later.map(o => ({ st: o, tr: beginTrack(o, lp, null, tol()) })) : [];
  try { svg.setPointerCapture(e.pointerId); } catch {}
  pointerId = e.pointerId; track = res; status = "drawing";
  setMsg(livre() ? "✏️" : "Isso! Siga o caminho até a estrelinha ★");
  ink.push([p]); render();
});

// Traçado contínuo (letras com "cont"): terminado um traço, o aluno pode seguir sem tirar a caneta,
// voltando pela linha até a bolinha do próximo traço. Esse trecho de passagem não é conferido.
// O próximo traço começa quando a caneta está perto da bolinha dele (até 16) e já anda no sentido dele:
// no "a" depois de subir pela perninha e virar para baixo; no "n" ao subir e seguir para o arco.
function bridgeStep(p, lp) {
  const d = G[digitIdx], next = d.strokes[strokeIdx + 1];
  const prev = bridge.last;
  if (!prev) { bridge.last = lp; return; }
  const mx = lp.x - prev.x, my = lp.y - prev.y, moved = Math.hypot(mx, my);
  if (moved < 3) return;
  bridge.last = lp;
  if (dist(lp, startOf(next)) > 16) return;
  const t = tangentAt(next, 4);
  if ((t.x * mx + t.y * my) / moved < 0.5) return;
  bridge = null;
  doneInk.push(ink); ink = [[p]]; strokeIdx++;
  track = { s: 0, back: 0, anchor: lp, drawn: 0 };
  shadows = d.strokes.slice(strokeIdx + 1).filter(o => typeof beginTrack(o, lp, null, tol()) !== "string")
    .map(o => ({ st: o, tr: beginTrack(o, lp, null, tol()) }));
  setMsg(livre() ? "✏️" : `Isso! Agora o traço ${strokeIdx + 1}, até a estrelinha ★`);
}

svg.addEventListener("pointermove", e => {
  if (pointerId !== e.pointerId || !track) return;
  const d = G[digitIdx];
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  for (const ev of evs.length ? evs : [e]) {
    const p = toSvg(ev); if (!p) continue;
    ink[ink.length - 1].push(p);
    const lp = local(p);
    if (bridge) { bridgeStep(p, lp); continue; }
    if (lifting) continue; // traço já chegou na estrelinha: o resto até tirar a caneta não conta
    const st = d.strokes[strokeIdx];
    for (const sh of shadows) stepTrack(sh.st, sh.tr, lp, tol());
    if (track.s < 8 && shadows.some(sh => sh.tr.s > 20)) { fail(orderText()); return; }
    const err = stepTrack(st, track, lp, tol());
    // depois de chegar na estrelinha, rabiscar sem tirar a caneta não é erro: só pede para tirar a caneta
    if (err && track.s >= st.len - 12) { lifting = true; setMsg("Muito bem! Agora tire a caneta da tela ✋"); continue; }
    if (err) { fail(ERROR_TEXT[err]); return; }
    // traçado contínuo: só depois de chegar mesmo no fim do traço
    if (d.cont && strokeIdx < d.strokes.length - 1 && track.s >= st.len - 12) bridge = { last: null };
  }
  render();
});

function onUp(e) {
  if (pointerId !== e.pointerId) return;
  pointerId = null; bridge = null; lifting = false; // tirou a caneta no meio da passagem: o traço anterior já está feito
  if (!track) return;
  const d = G[digitIdx], st = d.strokes[strokeIdx];
  if (!reachedEnd(st, track, tol())) {
    // fez inteiro o caminho de um traço que vem depois (no A, M e N os dois traços saem da mesma bolinha)
    if (shadows.some(sh => reachedEnd(sh.st, sh.tr, tol()))) { fail(orderText()); return; }
    if (wanderedOff(st, track)) { fail(ERROR_TEXT["outro-caminho"]); return; }
    status = "idle"; setMsg(livre() ? "Continue de onde parou" : "Continue de onde parou até a estrelinha ★"); render(); return;
  }
  doneInk.push(ink); ink = []; track = null;
  if (strokeIdx < d.strokes.length - 1) {
    strokeIdx++; status = "idle";
    setMsg(livre() ? "Muito bem! Agora o próximo traço" : `Muito bem! Agora o traço ${strokeIdx + 1}: comece na bolinha ●`); beep("ok"); render(); return;
  }
  if (mode === "folha") return finishSheetDigit();
  const firstTimeAll = !allTrained();
  status = "success"; setMsg("Parabéns! Traçado certinho! ★", "ok"); beep("fim");
  stars[d.label] = (stars[d.label] || 0) + 1; save();
  renderNav(); render(); clearTimers();
  if (firstTimeAll && allTrained()) {
    // treinou todos: passa para a folha do 1 ao 10
    timer = setTimeout(() => { setMsg(`Você treinou ${T.all}! Agora a folha ★`, "ok"); timer = setTimeout(() => setMode("folha"), 2200); }, 1500);
    return;
  }
  timer = setTimeout(() => { resetTrace(); status = "idle"; setMsg(livre() ? "De novo!" : "De novo! Comece na bolinha ●"); render(); }, 1800);
}

function finishSheetDigit() {
  // cada número é livre: o aluno pode fazer só um, vários, ou repetir o mesmo quantas vezes quiser
  const label = G[digitIdx].label;
  const o = layout.cells[digitIdx]; // guarda relativo à célula (ver renderFolha)
  sheetInk[digitIdx] = doneInk.map(stroke => stroke.map(piece => piece.map(p => ({ x: p.x - o.ox, y: p.y - o.oy }))));
  doneInk = []; strokeIdx = 0; track = null; status = "idle";
  const falta = G.map((d, i) => i).filter(i => !(i in sheetInk));
  if (!falta.length && !sheetCelebrated) {
    sheetCelebrated = true; sheets[kind] = (sheets[kind] || 0) + 1; save(); beep("fim");
    setMsg((errors ? `Parabéns! Você fez ${T.done} sozinho! ★ (${errors} ${errors === 1 ? "erro" : "erros"})` : `Parabéns! Você fez ${T.done} sozinho, sem nenhum erro! ★`) + ` Pode repetir ${kind !== "numeros" ? "qualquer letra" : "qualquer número"}.`, "ok");
    render(); return;
  }
  beep("ok");
  if (sound) setTimeout(() => speak(label), 350);
  const faltaTxt = !falta.length ? "" : falta.length <= 6 ? ` Faltam: ${falta.map(i => G[i].label).join(", ")}` : ` Faltam ${falta.length}.`;
  setMsg(`Muito bem! ★ Repita ${T.the(label)} ou escolha ${T.other}.` + faltaTxt, "ok");
  render();
}

svg.addEventListener("pointerup", onUp);
svg.addEventListener("pointercancel", onUp);
svg.addEventListener("contextmenu", e => e.preventDefault());

$("demo").onclick = startDemo;
$("say").onclick = sayCurrent;
$("say-folha").onclick = sayCurrent;
$("prev").onclick = () => goTo(digitIdx - 1);
$("next").onclick = () => goTo(digitIdx + 1);
$("clear").onclick = () => { clearTimers(); resetTrace(); demo = null; status = "idle"; setMsg(livre() ? "Pode começar" : "Comece na bolinha ●"); render(); };
$("sheet-restart").onclick = startSheet;
// folha em páginas (celular): trocar de página deixa para depois o traço que estava pela metade
const goPage = delta => {
  if (!layout || pointerId !== null) return;
  page = Math.max(0, Math.min(layout.pages - 1, page + delta));
  resetTrace(); status = "idle";
  setMsg(`Escolha ${T.pick} desta página` + (livre() ? "" : " e comece na bolinha ●"));
  render();
};
$("page-prev").onclick = () => goPage(-1);
$("page-next").onclick = () => goPage(1);
for (const l of LEVELS) $("lvl-" + l).onclick = () => setLevel(l);
$("tab-treino").onclick =() => { if (mode !== "treino") setMode("treino"); };
$("tab-folha").onclick = () => { if (mode !== "folha") setMode("folha"); };
// idioma da voz: português ↔ inglês; fala o nome do atual no idioma novo para a criança ouvir a diferença
const renderVoice = () => { $("voice-lang").textContent = voiceLang === "en" ? "Voz: English" : "Voz: Português"; };
$("voice-lang").onclick = () => {
  voiceLang = voiceLang === "en" ? "pt" : "en";
  try { localStorage.setItem("tracado-voz", voiceLang); } catch {}
  renderVoice();
  // avisa se o aparelho não tem voz no idioma escolhido (as vozes podem demorar a carregar: só avisa se a lista já veio)
  const vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  const has = vs.some(v => (v.lang || "").toLowerCase().startsWith(voiceLang));
  if (vs.length && !has) setMsg(voiceLang === "en" ? "Este aparelho não tem voz em inglês instalada. Instale nas configurações de voz do aparelho." : "Este aparelho não tem voz em português instalada.");
  else if (sound && !inHome()) speak(G[digitIdx].label);
};
renderVoice();
$("sound").onclick = () => {
  sound = !sound;
  $("sound").textContent = sound ? "Som: ligado" : "Som: desligado";
  $("sound").setAttribute("aria-pressed", String(sound));
};

// Novo aluno: zera as estrelinhas deste tablet (pede confirmação com um segundo toque)
let novoTimer = null;
$("novo").onclick = () => {
  const b = $("novo");
  if (!b.classList.contains("warn")) {
    b.classList.add("warn"); b.textContent = "Toque de novo para zerar";
    novoTimer = setTimeout(() => { b.classList.remove("warn"); b.textContent = "Novo aluno"; }, 3000);
    return;
  }
  clearTimeout(novoTimer); b.classList.remove("warn"); b.textContent = "Novo aluno";
  stars = {}; sheets = {}; save();
  if (inHome()) { b.textContent = "Zerado ✓"; novoTimer = setTimeout(() => { b.textContent = "Novo aluno"; }, 1500); return; }
  mode = "treino"; setMode("treino"); goTo(0);
};

let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  // o traço pela metade é refeito (as posições mudam); os já terminados continuam no lugar
  resizeTimer = setTimeout(() => {
    if (pointerId !== null || inHome()) return;
    if (mode === "folha") { layout = null; resetTrace(); render(); }
    else render(); // o quadro do treino muda ao girar o celular (o traço fica no lugar: está nas medidas da letra)
  }, 150);
});

// mantém a tela do tablet acesa enquanto o aluno treina
async function keepAwake() { try { await navigator.wakeLock.request("screen"); } catch {} }
keepAwake();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });

showHome("kinds");
</script>
<script>
// funciona sem internet depois da primeira visita, e o tablet recebe as atualizações sozinho
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
