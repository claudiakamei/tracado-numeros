<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Treino de traçado de números (1 a 10) e letras minúsculas e maiúsculas com caneta no tablet: exemplo animado da bolinha à estrelinha, aviso de sentido e ordem errados, nome falado e folha em tamanho menor.">
<meta name="theme-color" content="#1f6fb2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Traçado">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Traçado de Números 1 ~ 10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Comic+Neue:wght@700&family=Dancing+Script:wght@700&family=Nunito:wght@600;800&display=swap">
<style>
  /* Layout: uma tela só, como uma folha de exercício — modos no alto, folha no centro, botões grandes embaixo.
     Treino: um número grande por vez. Folha: do 1 ao 10 pequenos, lado a lado, como a folha de papel. */
  :root {
    --bg: #eef3f6;          /* mesa */
    --sheet: #ffffff;       /* folha */
    --fg: #1d2a33;
    --muted: #5d6f7b;
    --line: #cfd9df;
    --band: #e4e9ec;        /* faixa cinza do traçado */
    --dash: #8a99a3;
    --mark: #15212a;        /* bolinha e estrelinha */
    --accent: #1f6fb2;      /* azul do traço do aluno */
    --accent-ink: #ffffff;
    --demo: #f08a24;        /* laranja do exemplo */
    --ok: #1d9a52;
    --ok-soft: #dff3e7;
    --err: #d23a2f;
    --err-soft: #fbe3e1;
    --info-soft: #e3eef7;
    --star: #f5c518;
    --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
    --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11181d; --sheet: #1b252c; --fg: #e8eef2; --muted: #9db0bc; --line: #2f3d47;
      --band: #2a363f; --dash: #7f919c; --mark: #f1f5f8; --accent: #5aa7e8; --accent-ink: #0d1a24;
      --demo: #f59a3c; --ok: #4cc77f; --ok-soft: #173326; --err: #f0675c; --err-soft: #3a1c1a;
      --info-soft: #1a2b38; --star: #f5c518; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11181d; --sheet: #1b252c; --fg: #e8eef2; --muted: #9db0bc; --line: #2f3d47;
    --band: #2a363f; --dash: #7f919c; --mark: #f1f5f8; --accent: #5aa7e8; --accent-ink: #0d1a24;
    --demo: #f59a3c; --ok: #4cc77f; --ok-soft: #173326; --err: #f0675c; --err-soft: #3a1c1a;
    --info-soft: #1a2b38; --star: #f5c518; color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--font-body);
    display: flex; flex-direction: column; gap: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-top: max(12px, env(safe-area-inset-top, 0px)); padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
    user-select: none; -webkit-user-select: none; touch-action: manipulation; overflow: hidden;
  }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 12px; }
  h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.4rem, 3.2vw, 2.1rem); margin: 0; line-height: 1.1; text-wrap: balance; }
  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  button { font: inherit; color: inherit; cursor: pointer; border-radius: 16px; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .soft { background: var(--sheet); border: 2px solid var(--line); padding: 8px 14px; font-weight: 800; }
  .soft.warn { border-color: var(--err); color: var(--err); }
  .tabs { display: inline-flex; border: 2px solid var(--line); border-radius: 18px; background: var(--sheet); padding: 3px; gap: 3px; }
  .tabs button { border: 0; background: none; padding: 7px 14px; font-weight: 800; border-radius: 14px; }
  .tabs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .tabs button.ready { animation: chama 1.2s ease-in-out infinite; }
  @keyframes chama { 50% { box-shadow: 0 0 0 4px var(--star); } }
  .tabs small { font-weight: 600; font-size: 0.75rem; }
  nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  nav button {
    position: relative; min-width: 3.2rem; padding: 4px 12px; font-family: var(--font-display); font-weight: 800;
    font-size: clamp(1.4rem, 3vw, 1.9rem); line-height: 1.3; background: var(--sheet); border: 2px solid var(--line);
    font-variant-numeric: tabular-nums;
  }
  nav button[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  /* letras: botões menores, na mesma fonte da letra que o aluno traça */
  body.letras nav { gap: 6px; }
  body.letras nav button { font-family: "Comic Neue", "Comic Sans MS", cursive; font-weight: 700; min-width: 2.6rem; padding: 0 8px; font-size: clamp(1.3rem, 2.6vw, 1.7rem); }
  /* palavras: são muitas e compridas; uma linha só, que rola para o lado, para sobrar a tela para a palavra */
  body.palavras nav { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; padding: 8px 2px 2px; scrollbar-width: thin; }
  body.palavras nav button { flex: none; padding: 0 12px; font-size: clamp(1.1rem, 2.2vw, 1.4rem); }
  /* as palavras são sempre faladas em português: sem o botão de voz em inglês */
  body.palavras:not(.home):not(.em-jogo) #voice-lang { display: none; }
  nav .badge {
    position: absolute; top: -9px; right: -9px; background: var(--star); color: #1d2a33; border-radius: 999px;
    font-family: var(--font-body); font-size: 0.72rem; padding: 1px 6px; line-height: 1.4;
  }
  #msg {
    text-align: center; font-weight: 800; font-size: clamp(1.05rem, 2.4vw, 1.4rem); padding: 10px 14px; border-radius: 16px;
    background: var(--info-soft); color: var(--fg); min-height: 1.5em;
  }
  #msg.err { background: var(--err-soft); color: var(--err); }
  #msg.ok { background: var(--ok-soft); color: var(--ok); }
  main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  svg#sheet {
    height: 100%; max-width: 100%; background: var(--sheet); border: 4px solid var(--line); border-radius: 24px;
    touch-action: none; display: block;
  }
  body.folha svg#sheet { border-radius: 10px; }
  svg#sheet.err { border-color: var(--err); }
  svg#sheet.ok { border-color: var(--ok); }
  footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; }
  footer button { padding: 12px 20px; font-size: 1.1rem; font-weight: 800; border: 2px solid var(--line); background: var(--sheet); }
  footer .demo { background: var(--demo); border-color: var(--demo); color: #fff; }
  footer .next { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .count { color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
  /* celular: cabeçalho e botões compactos e a fileira de letras numa faixa só, que rola para o lado,
     para sobrar espaço para a letra */
  @media (max-width: 640px), (max-height: 520px) {
    body { gap: 6px; padding-top: max(8px, env(safe-area-inset-top, 0px)); padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); }
    h1 { font-size: 1.15rem; }
    header { gap: 6px; }
    .tools { gap: 6px; }
    .soft { padding: 5px 9px; font-size: 0.85rem; }
    .tabs button { padding: 5px 9px; font-size: 0.85rem; }
    nav, body.letras nav { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; padding: 8px 2px 2px; gap: 6px; scrollbar-width: none; }
    nav button, body.letras nav button { flex: none; min-width: 2.4rem; padding: 0 8px; font-size: 1.25rem; }
    #msg { font-size: 0.95rem; padding: 6px 10px; }
    footer { gap: 6px; }
    footer button { padding: 8px 12px; font-size: 0.95rem; }
    .count { font-size: 0.8rem; }
    /* treino no celular: cabeçalho e botões numa linha só, para sobrar a tela para a letra */
    body:not(.home) h1 { display: none; }
    header .tools { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; width: 100%; padding-bottom: 2px; }
    header .tools > * { flex: none; order: 2; }
    /* o nível de ajuda fica sempre à vista, logo depois do Início (o resto da faixa rola para o lado) */
    header #home-btn { order: 0; }
    header #levels { order: 1; }
    #foot-treino { flex-wrap: nowrap; }
    #foot-treino .lbl, #foot-treino .count { display: none; }
  }
  /* crédito discreto no canto, com a logo num fundo claro (a logo tem letras escuras) */
  .credit { align-self: flex-end; display: inline-flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--muted); text-decoration: none; margin-top: -4px; }
  .credit img { height: 28px; width: auto; background: #fff; border-radius: 6px; padding: 2px 5px; }
  /* tela inicial: cartões grandes e coloridos para escolher o que treinar e depois o modo */
  body.home nav, body.home #msg, body.home main, body.home footer, body.home .tabs, body.home #home-btn { display: none !important; }
  /* jogos de números: usam a faixa de mensagem e o Início; escondem o que é do traçado */
  body.em-jogo nav, body.em-jogo main, body.em-jogo footer, body.em-jogo .tabs { display: none !important; }
  /* a faixa de mensagem fica logo abaixo do cabeçalho, acima do jogo */
  body.em-jogo header { order: 0; } body.em-jogo #msg { order: 1; } body.em-jogo .jogo { order: 2; } body.em-jogo .credit { order: 3; }
  #bol-jogo { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; margin: auto 0; }
  .home-sub { position: relative; z-index: 1; margin: 4px 0 -6px; font-family: var(--font-display); font-weight: 800; font-size: clamp(1.1rem, 2.6vw, 1.5rem); color: var(--muted); }
  #home-games { width: min(100%, 1100px); }
  @media (min-width: 1000px) { #home-games { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
  .c6 { background: #d9822b; } .c7 { background: #2f8f9d; } .c8 { background: #6a8f1f; } .c9 { background: #b5651d; } .c10 { background: #3d7ea6; } .c11 { background: #8a3fa0; } .c12 { background: #c0392b; } .c13 { background: #1f7a5a; }
  /* fale o número: cartão grande, microfone e o que o reconhecedor ouviu */
  .fala-modos { width: min(100%, 900px); margin: auto 0; display: grid; gap: 10px; }
  .fala-modos h3 { margin: 6px 0 0; font-family: var(--font-display); font-size: 1.2rem; color: var(--muted); }
  .fala-modos .grupo { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .fala-modos .card { padding: 14px 8px; }
  .fala-modos .card .glyph { font-size: clamp(1.6rem, 4vw, 2.4rem); }
  #fala-jogo { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; margin: auto 0; }
  .fala-cartao { display: flex; align-items: center; justify-content: center; min-height: clamp(160px, 32vh, 300px); transition: border-color 0.2s, background 0.2s; }
  .fala-cartao span { font-family: var(--font-display); font-weight: 800; font-size: clamp(5rem, 22vw, 12rem); line-height: 1; }
  .fala-cartao.certo { border-color: var(--ok); background: var(--ok-soft); } .fala-cartao.errado { border-color: var(--err); background: var(--err-soft); }
  .fala-mic { width: 96px; height: 96px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; font-size: 2.6rem; box-shadow: 0 6px 0 rgba(0,0,0,0.18); }
  .fala-mic.ouvindo { background: #c0392b; animation: escuta 1s ease-in-out infinite; }
  @keyframes escuta { 50% { box-shadow: 0 0 0 14px rgba(192, 57, 43, 0.25); } }
  .fala-mic:disabled { opacity: 0.5; }
  .fala-ouvi { margin: 0; min-height: 1.4em; font-weight: 700; color: var(--muted); text-align: center; }
  .fala-manual { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--muted); }
  .fala-manual .soft { padding: 4px 10px; font-size: 0.85rem; }
  .fala-fim-erros { margin: 0 0 14px; font-weight: 700; }
  /* pares e ímpares: números dados e quadradinhos para escrever com a caneta */
  .jogo-board.dois-board { display: flex; flex-direction: column; gap: 14px; width: min(100%, 1000px); }
  .dois-ferramentas { display: flex; gap: 8px; flex-wrap: wrap; }
  .dois-ferramentas .sel { border-color: var(--accent); background: var(--info-soft); color: var(--accent); }
  .dois-ferramentas .dois-prof { margin-left: auto; font-size: 0.8rem; color: var(--muted); }
  .dois-linha { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding: 6px 0; }
  .dois-linha + .dois-linha { border-top: 2px dashed var(--line); padding-top: 14px; }
  .dois-num { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 4vw, 2.2rem); min-width: 2.2ch; text-align: center; }
  .dois-caixa { width: clamp(84px, 14vw, 120px); height: clamp(64px, 10vw, 86px); border: 2px solid var(--line); border-radius: 14px; background: var(--sheet);
    touch-action: none; display: block; background-image: linear-gradient(transparent calc(100% - 14px), var(--band) calc(100% - 14px), var(--band) calc(100% - 12px), transparent calc(100% - 12px)); }
  .dois-caixa.atual { border-color: var(--accent); }
  .dois-caixa.certa { border-color: var(--ok); background-color: var(--ok-soft); }
  .dois-caixa.errada { border-color: var(--err); background-color: var(--err-soft); animation: treme 0.35s; }
  /* folha 1: círculos como a folha 3A (ímpares rosa, pares azuis; os que faltam em branco para escrever) */
  .dois-linha.circ { --c: clamp(54px, 7.4vw, 80px); gap: 6px; }
  .dois-linha.circ.junta { border-top: 0; padding-top: 0; margin-top: -8px; }
  .dois-num.circ { width: var(--c); height: var(--c); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #1d2a33; font-size: clamp(1.4rem, 3.2vw, 2rem); }
  .dois-num.circ.impar { background: #f6c6d3; } .dois-num.circ.par { background: #bfe0f2; }
  .dois-caixa.circ { width: var(--c); height: var(--c); border-radius: 50%; border: 3px solid #9aa6ad; background-image: none; }
  .dois-caixa.circ.atual { border-color: var(--accent); } .dois-caixa.circ.certa { border-color: var(--ok); } .dois-caixa.circ.errada { border-color: var(--err); }
  /* sons das letras */
  body.missao nav, body.missao #prev, body.missao #next, body.missao .tabs { display: none !important; }
  .niveis button.par-sons { font-family: "Comic Neue", "Comic Sans MS", cursive; font-weight: 700; letter-spacing: 0.1em; white-space: nowrap; padding: 4px 12px; }
  .fono-destaque { display: flex; flex-direction: column; align-items: center; gap: 14px; margin: auto 0; max-width: 520px; }
  .fono-fig-grande { display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: 3px solid #ef6239; border-radius: 24px; padding: 14px 28px; }
  .fono-fig-grande img { width: clamp(120px, 30vw, 200px); height: auto; aspect-ratio: 1; }
  .fono-fig-grande span { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.4rem, 4vw, 2rem); }
  .fono-acoes { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .fono-acoes button { font-size: 1.15rem; padding: 10px 18px; }
  .fono-escrever { font-weight: 800; border: 0; background: var(--accent); color: var(--accent-ink); }
  .fono-topo { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; font-weight: 800; color: var(--muted); }
  .fono-grade { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .fono-grade button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; border: 2px solid var(--line); background: var(--bg); border-radius: 18px; }
  /* como na folha de pintar: a figura fica cinza até a criança acertar; aí ganha cor */
  .fono-grade img { width: clamp(52px, 13vw, 96px); height: auto; aspect-ratio: 1; filter: grayscale(1) opacity(0.55); transition: filter 0.3s; }
  .fono-grade span { font-weight: 800; font-size: clamp(0.85rem, 2.2vw, 1.05rem); }
  .fono-grade button.pintada { border-color: var(--ok); background: var(--ok-soft); }
  .fono-grade button.pintada img { filter: none; }
  .fono-grade button.treme { animation: treme 0.35s; border-color: var(--err); background: var(--err-soft); }
  .fono-credito { margin: 0; font-size: 0.7rem; color: var(--muted); }
  @media (max-width: 640px), (max-height: 520px) { .fono-grade { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; } }
  .card .glyph.dots-glyph { font-size: clamp(1rem, 2.6vw, 1.5rem); line-height: 1.1; letter-spacing: 0.08em; padding: 0.35em 0.5em; }
  .jogo { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 4px 0; }
  .jogo-board { width: min(100%, 720px); background: var(--sheet); border: 2px solid var(--line); border-radius: 24px; padding: 16px; }
  .niveis { display: flex; flex: none; gap: 6px; overflow-x: auto; max-width: 100%; padding: 8px 4px 4px; scrollbar-width: none; }
  .niveis button { position: relative; flex: none; min-width: 2.8rem; padding: 4px 8px; font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; background: var(--sheet); border: 2px solid var(--line); }
  .niveis button[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .niveis button.feito::after { content: "✓"; position: absolute; top: -8px; right: -6px; background: var(--ok); color: #fff; border-radius: 999px; font-size: 0.7rem; padding: 1px 5px; }
  .pares-alvo { display: flex; align-items: center; justify-content: center; gap: 14px; font-weight: 800; color: var(--muted); text-align: right; }
  .pares-alvo b { font-family: var(--font-display); font-size: 2.6rem; color: #fff; background: #ef6239; width: 4.6rem; height: 4.6rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .pares-alvo b.pulsa { animation: pulsa 0.5s ease; }
  @keyframes pulsa { 40% { transform: scale(1.18); } }
  .barra { height: 10px; background: var(--band); border-radius: 6px; overflow: hidden; margin: 12px 0; }
  .barra div { height: 100%; width: 0; background: var(--ok); transition: width 0.4s; }
  .pares-area { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .pares-col { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; flex: 1; max-width: 300px; }
  .pares-col button { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.1rem, 3vw, 1.5rem); padding: 6px 0; border: 2px solid var(--line); background: var(--bg); border-radius: 12px; }
  .pares-col button.sel { border-color: var(--accent); background: var(--info-soft); color: var(--accent); }
  .pares-col button.usado { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); opacity: 0.55; pointer-events: none; }
  .pares-col button.treme { animation: treme 0.35s; border-color: var(--err); background: var(--err-soft); }
  @keyframes treme { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .pares-mais { font-family: var(--font-display); font-weight: 800; font-size: 2rem; color: var(--muted); }
  .achados-titulo { margin: 14px 0 6px; font-weight: 800; color: var(--muted); font-size: 0.95rem; }
  .achados { display: flex; flex-wrap: wrap; gap: 6px; min-height: 30px; }
  .achados span { border: 2px solid var(--ok); color: var(--ok); border-radius: 999px; padding: 2px 12px; font-family: var(--font-display); font-weight: 800; }
  .bol-niveis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; width: min(100%, 560px); margin: auto 0; }
  .bol-topo { display: flex; justify-content: space-between; width: min(100%, 720px); font-weight: 800; color: var(--muted); }
  .bol-quadros { display: flex; justify-content: center; transition: border-color 0.2s; }
  .bol-quadros.certo { border-color: var(--ok); } .bol-quadros.errado { border-color: var(--err); }
  /* como a folha Leitura de Bolinhas: fileiras de 5, uma embaixo da outra, a última incompleta à esquerda;
     a altura fica a do maior número do nível, para os botões não pularem de lugar */

          x: u*u*u*p0.x + 3*u*u*t*p1.x + 3*u*t*t*p2.x + t*t*t*p3.x,
          y: u*u*u*p0.y + 3*u*u*t*p1.y + 3*u*t*t*p2.y + t*t*t*p3.y,

      }
      cur = p3;
    }

function buildStroke(d) {
  const raw = parsePath(d), rawCum = [0];
  for (let k = 1; k < raw.length; k++) rawCum.push(rawCum[k-1] + dist(raw[k-1], raw[k]));
  const len = rawCum[rawCum.length - 1], n = Math.max(2, Math.round(len));
  const pts = [], cum = []; let j = 0;
  for (let k = 0; k <= n; k++) {
    const s = len * k / n;
    while (j < raw.length - 2 && rawCum[j+1] < s) j++;
    const a = raw[j], b = raw[j+1], seg = rawCum[j+1] - rawCum[j] || 1;
    const f = Math.min(1, Math.max(0, (s - rawCum[j]) / seg));
    pts.push({ x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f }); cum.push(s);
  }
  return { d, pts, cum, len };
}

  document.body.classList.toggle("palavras", kind === "cursivaPal" || kind === "bastaoPal");
  nav.hidden = mode !== "treino";
  nav.setAttribute("aria-label", "Escolher " + T.one);
  $("foot-treino").hidden = mode !== "treino";
  $("foot-folha").hidden = mode !== "folha";
  $("sheet-count").textContent = `Feitos: ${Object.keys(sheetInk).length} de ${G.length} · Erros nesta folha: ${errors} · Folhas completas: ${sheets[kind] || 0}`;
  $("errors").textContent = `Erros ${T.here}: ${errors}`;
  const paged = mode === "folha" && layout && layout.pages > 1;
  for (const id of ["page-prev", "page-label", "page-next"]) $(id).hidden = !paged;
  if (paged) {

    $("page-prev").disabled = page === 0;
    $("page-next").disabled = page === layout.pages - 1;

}

function renderNav() {
  nav.innerHTML = "";
  G.forEach((d, k) => {
    const b = document.createElement("button");
    b.textContent = d.label;
    b.setAttribute("aria-current", k === digitIdx ? "true" : "false");
    b.setAttribute("aria-label", (d.word ? "Palavra " : kind !== "numeros" ? "Letra " : "Número ") + d.label);
    if (stars[sid(d)]) { const s = document.createElement("span"); s.className = "badge"; s.textContent = "★" + stars[sid(d)]; b.appendChild(s); }

// ----- desenho -----
const ROUND = { fill: "none", "stroke-linecap": "round", "stroke-linejoin": "round" };

// guias de um número (faixa, tracejado, bolinhas e estrelinhas) num grupo já posicionado
function drawGuides(g, d, activeStroke) {
  if (d.font) {
    // a letra cinza é a própria fonte (Comic Neue), um pouco engrossada para servir de faixa; na palavra em
    // letra bastão, cada letra vai na sua posição (a mesma dos caminhos)
    for (const parte of d.fontParts || [{ label: d.label, x: 0 }]) {
      const t = el("text", { x: parte.x, y: LETTER_FONT.base, "font-family": LETTER_FONT.family, "font-weight": 700, "font-size": LETTER_FONT.size,
        fill: "var(--band)", stroke: "var(--band)", "stroke-width": 7, "stroke-linejoin": "round" }, g);
      t.textContent = parte.label;
    }
  }
  if (d.lined) {
    // pauta do caderno de cursiva: base contínua, as outras tracejadas
    const L = CURSIVE_LINES, x1 = d.x0 - 6, x2 = d.width + 6;
    for (const y of [L.top, L.mid, L.base, L.desc])
      el("line", { x1, x2, y1: y, y2: y, stroke: "var(--line)", "stroke-width": y === L.base ? 1.6 : 1, ...(y === L.base ? {} : { "stroke-dasharray": "4 4" }) }, g);
  }
  d.strokes.forEach(st => {
    // pingo do i e do j da cursiva: sem fonte por baixo, a faixa cinza mostra o lugar do pingo
    if (isTap(st)) { if (!d.font) el("circle", { cx: st.pts[0].x, cy: st.pts[0].y, r: (d.band || 22) / 2 + 1, fill: "var(--band)" }, g); return; }
    if (!d.font) el("path", { d: st.d, ...ROUND, stroke: "var(--band)", "stroke-width": d.band || 22 }, g);
    el("path", { d: st.d, fill: "none", stroke: "var(--dash)", "stroke-width": 1.3, "stroke-dasharray": "3 3" }, g);
  });
  // nas palavras, um traço que emenda no anterior (sem tirar a caneta) não ganha bolinha nem número, e a
  // estrelinha só aparece onde a caneta sai do papel; a numeração conta só onde a caneta encosta
  const emenda = k => d.word && k > 0 && k < d.strokes.length && dist(startOf(d.strokes[k]), endOf(d.strokes[k - 1])) < 3;
  const encostadas = d.strokes.filter((st, k) => !emenda(k)).length;
  let toque = 0;
  return () => d.strokes.forEach((st, k) => {
    if (livre()) return; // livre: sem bolinha, estrelinha e número do traço
    const a = startOf(st), b = endOf(st);
    const m = el("g", { "pointer-events": "none" }, g);
    if (d.word) {
      if (!emenda(k)) toque++;
      if (k === activeStroke && !emenda(k)) {
        const c = el("circle", { class: "pulse", cx: a.x, cy: a.y, r: 9, fill: "none", stroke: "var(--ok)", "stroke-width": 2 }, m);
        el("animate", { attributeName: "r", values: "7;13;7", dur: "1.2s", repeatCount: "indefinite" }, c);
        el("animate", { attributeName: "opacity", values: "1;0.3;1", dur: "1.2s", repeatCount: "indefinite" }, c);
      }
      if (!isTap(st) && level === "ajuda" && !emenda(k + 1)) el("path", { d: starPath(b.x, b.y, 6.5), fill: "var(--mark)" }, m);
      if (emenda(k)) return;
      el("circle", { cx: a.x, cy: a.y, r: 4.5, fill: "var(--mark)" }, m);
      if (encostadas > 1) {
        const t = el("text", { x: a.x - 11, y: a.y - 6, "font-size": 9, "font-weight": 800, fill: "var(--accent)", "font-family": "var(--font-body)" }, m);
        t.textContent = String(toque);
      }
      return;
    }
    if (k === activeStroke) {
      const c = el("circle", { class: "pulse", cx: a.x, cy: a.y, r: 9, fill: "none", stroke: "var(--ok)", "stroke-width": 2 }, m);
      el("animate", { attributeName: "r", values: "7;13;7", dur: "1.2s", repeatCount: "indefinite" }, c);
      el("animate", { attributeName: "opacity", values: "1;0.3;1", dur: "1.2s", repeatCount: "indefinite" }, c);
    }
    if (!isTap(st) && level === "ajuda") el("path", { d: starPath(b.x, b.y, 6.5), fill: "var(--mark)" }, m); // o pingo só tem a bolinha
    el("circle", { cx: a.x, cy: a.y, r: 4.5, fill: "var(--mark)" }, m);
    if (d.strokes.length > 1) {
      // bolinhas juntas (o 5; o a, d, g, q): o número do 2º traço vai para o outro lado
      const shared = d.strokes.slice(0, k).some(o => dist(startOf(o), a) < 14);
      const t = el("text", { x: a.x + (shared ? 4 : -11), y: a.y - 6, "font-size": 9, "font-weight": 800, fill: "var(--accent)", "font-family": "var(--font-body)" }, m);
      t.textContent = String(k + 1);
    }
  });
}

function drawInk(parent) {
  doneInk.flat().forEach(pts => el("polyline", { points: ptsAttr(pts), ...ROUND, stroke: "var(--ok)", "stroke-width": 6 }, parent));
  const inkColor = status === "error" ? "var(--err)" : status === "success" ? "var(--ok)" : "var(--accent)";
  ink.forEach(pts => el("polyline", { points: ptsAttr(pts), ...ROUND, stroke: inkColor, "stroke-width": 6 }, parent));
}

const waitingStart = () => status !== "demo" && status !== "success" && !(track && track.s > 0);

function render() {
  if (mode === "folha" && !layout) computeLayout(); // o cabeçalho precisa saber se a folha tem páginas
  renderHeader();
  svg.innerHTML = "";
  if (mode === "treino") renderTreino(); else renderFolha();
}

const PHONE = matchMedia("(max-width: 640px), (max-height: 520px)"); // o mesmo limite do CSS do celular
function renderTreino() {
  const d = G[digitIdx], pad = 14;
  svg.style.width = svg.style.height = "";
  // no celular o quadro corta o espaço vazio acima e abaixo da letra (o "a" não guarda lugar da haste do "b")
  let y0 = 0, y1 = d.height;
  if (PHONE.matches) {
    const ys = d.strokes.flatMap(st => st.pts.map(p => p.y));
    y0 = Math.max(0, Math.min(...ys) - 16); y1 = Math.min(d.height, Math.max(...ys) + 16);
  }
  svg.setAttribute("viewBox", `${d.x0 - pad} ${y0 - pad} ${d.width - d.x0 + pad * 2} ${y1 - y0 + pad * 2}`);
  const g = el("g", {}, svg);
  const marks = drawGuides(g, d, waitingStart() ? strokeIdx : -1);
  if (demo) {
    d.strokes.slice(0, demo.stroke + 1).forEach((st, k) => {
      const pts = st.pts.slice(0, indexAt(st, k < demo.stroke ? st.len : demo.s) + 1);
      el("polyline", { points: ptsAttr(pts), ...ROUND, stroke: "var(--demo)", "stroke-width": 7 }, svg);
      if (k === demo.stroke) { const h = pts[pts.length - 1]; el("circle", { cx: h.x, cy: h.y, r: 7, fill: "var(--demo)", stroke: "var(--sheet)", "stroke-width": 2 }, svg); }
    });
  }
  drawInk(svg);
  marks();
}

// Folha: as células ficam lado a lado como na folha de papel, quebrando em mais linhas se a tela for estreita.
const CELL_PAD = 10;
const cellW = d => d.width - d.x0 + CELL_PAD * 2;
function computeLayout() {
  const CELL_H = G[0].height + CELL_PAD * 2;
  const W = Math.max(200, mainEl.clientWidth - 8), Hh = Math.max(150, mainEl.clientHeight - 8);
  const all = G.map((d, i) => i);
  const widthOf = idxs => idxs.reduce((s, i) => s + cellW(G[i]), 0);
  const rowsFor = (limit, idxs) => {
    const rows = [[]]; let x = 0;
    idxs.forEach(i => {
      if (x + cellW(G[i]) > limit && rows[rows.length - 1].length) { rows.push([]); x = 0; }
      rows[rows.length - 1].push(i); x += cellW(G[i]);
    });
    return rows;
  };
  // equilibra as linhas (evita uma linha cheia e outra com um número só)
  const balanced = (limit, idxs) => {
    let rows = rowsFor(limit, idxs);
    for (let lim = widthOf(idxs) / rows.length; lim <= limit; lim += 10) {
      const r = rowsFor(lim, idxs);
      if (r.length <= rows.length) { rows = r; break; }
    }
    return rows;
  };
  // px por unidade: o número fica com ~105px de altura, perto do tamanho da folha de papel.
  // Nunca diminui abaixo de K_MIN (no celular as letras ficariam minúsculas): se não couber, a folha vira páginas.
  // A minúscula só ocupa o meio do quadradinho (em cima e embaixo é lugar das hastes do b e do g):
  // encolhida como a maiúscula, o a, o c e o e ficariam miúdos. Por isso ela não diminui: vira páginas.
  const K_MIN = kind === "letras" || kind.startsWith("cursiva") || kind === "bastaoPal" ? 0.75 : 0.55;
  let k = 0.75, rows;
  for (;;) {
    rows = balanced(W / k, all);
    if (rows.length * CELL_H * k <= Hh || k <= K_MIN + 1e-9) break;
    k = Math.max(K_MIN, k - 0.05);
  }
  // em páginas: reparte as letras em partes iguais por página (13 e 13, não 21 e 5) e só depois monta as linhas
  const fitRows = Math.max(1, Math.floor(Hh / (CELL_H * k)));
  let pageRows = [rows];
  if (rows.length > fitRows) {
    for (let P = Math.ceil(rows.length / fitRows); P <= G.length; P++) {
      const total = widthOf(all), chunks = [];
      let cur = [], acc = 0;
      all.forEach(i => {
        // fecha a página quando passar da sua parte da largura total (a última fica com o resto)
        if (cur.length && chunks.length < P - 1 && acc + cellW(G[i]) / 2 > total * (chunks.length + 1) / P) { chunks.push(cur); cur = []; }
        cur.push(i); acc += cellW(G[i]);
      });
      chunks.push(cur);
      pageRows = chunks.map(c => balanced(W / k, c));
      if (pageRows.every(r => r.length <= fitRows)) break;
    }
    rows = pageRows.flat();
  }
  // se a tela for estreita demais até para uma célula, encolhe só o necessário para caber na largura
  const widest = Math.max(...rows.map(row => row.reduce((s, i) => s + cellW(G[i]), 0)));
  k = Math.min(k, W / widest);
  const perPage = Math.max(...pageRows.map(r => r.length));
  const cells = []; let width = 0;
  pageRows.forEach((pr, pg) => pr.forEach((row, r) => {
    let x = 0;
    const y = r * CELL_H;
    row.forEach(i => {
      const w = cellW(G[i]);
      cells[i] = { x, y, w, h: CELL_H, ox: x + CELL_PAD - G[i].x0, oy: y + CELL_PAD, page: pg };
      x += w;
    });
    width = Math.max(width, x);
  }));
  const pages = pageRows.length;
  page = Math.min(page, pages - 1);
  layout = { k, cells, width, height: perPage * CELL_H, pages };
}

function renderFolha() {
  if (!layout) computeLayout();
  const { k, cells, width, height } = layout;
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
  svg.style.width = width * k + "px";
  svg.style.height = height * k + "px";
  let marks = [];
  G.forEach((d, i) => {
    const c = cells[i];
    if (c.page !== page) return; // outra página da folha
    if (i in sheetInk) el("rect", { x: c.x + 2, y: c.y + 2, width: c.w - 4, height: c.h - 4, rx: 8, fill: "var(--ok-soft)" }, svg);
    else if (i === digitIdx && status !== "success") el("rect", { x: c.x + 2, y: c.y + 2, width: c.w - 4, height: c.h - 4, rx: 8, fill: "var(--info-soft)" }, svg);
    el("rect", { x: c.x, y: c.y, width: c.w, height: c.h, fill: "none", stroke: "var(--line)", "stroke-width": 1.2 }, svg);
    const g = el("g", { transform: `translate(${c.ox} ${c.oy})` }, svg);
    marks.push(drawGuides(g, d, i === digitIdx && waitingStart() ? strokeIdx : -1));
  });
  // traços já terminados ficam guardados relativos à sua célula: continuam no lugar se a tela mudar de tamanho
  for (const i in sheetInk) {
    const c = cells[i];
    if (c.page !== page) continue;
    const g = el("g", { transform: `translate(${c.ox} ${c.oy})` }, svg);
    sheetInk[i].flat().forEach(pts => el("polyline", { points: ptsAttr(pts), ...ROUND, stroke: "var(--ok)", "stroke-width": 6 }, g));
  }
  drawInk(svg);
  marks.forEach(m => m());
}

// ----- controle -----
function clearTimers() {
  if (timer) clearTimeout(timer);
  if (raf) cancelAnimationFrame(raf);
  timer = raf = null;
}
function resetTrace() { track = null; pointerId = null; strokeIdx = 0; doneInk = []; ink = []; bridge = null; lifting = false; pingosFeitos = new Set(); }

function startDemo() {
  if (mode !== "treino") return;
  clearTimers(); resetTrace();
  status = "demo"; setMsg("Olhe o caminho: da bolinha ● para a estrelinha ★");
  const d = G[digitIdx];
  if (sound) speak(d.label);
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
    demo = { stroke: d.strokes.length - 1, s: d.strokes[d.strokes.length - 1].len }; render();
    timer = setTimeout(endDemo, 1500); return;
  }
  let k = 0, s = 0, last = performance.now();
  const tick = now => {
    s += (now - last) / 1000 * DEMO_SPEED; last = now;
    if (s >= d.strokes[k].len) {
      if (k < d.strokes.length - 1) { k++; s = 0; }
      else { demo = { stroke: k, s: d.strokes[k].len }; render(); timer = setTimeout(endDemo, 700); return; }
    }
    demo = { stroke: k, s }; render();
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
}
function endDemo() { demo = null; status = "idle"; setMsg("Agora é sua vez! Comece na bolinha ●"); render(); }

// começo de cada número no treino: com exemplo animado, ou no livre só fala o nome
function startTurn() {
  if (!livre()) return startDemo();
  clearTimers(); resetTrace(); demo = null; status = "idle";
  const d = G[digitIdx];
  if (sound) speak(d.label);
  setMsg(`Agora sozinho! Faça ${T.the(d.label)}`); render();
}

function goTo(idx) {
  clearTimers(); errors = 0; demo = null;
  digitIdx = (idx + G.length) % G.length;
  renderNav(); startTurn();
}

function setMode(m) {
  clearTimers(); resetTrace(); demo = null; errors = 0; mode = m;
  if (m === "folha") {
    digitIdx = 0; sheetInk = {}; sheetCelebrated = false; layout = null; page = 0; status = "idle";
    setMsg(sheetText());
    render();
  } else {
    renderNav(); startTurn();
  }
}
const sheetText = () => `Agora sozinho! Escolha ${T.pick} da folha` + (livre() ? "" : " e comece na bolinha ●");

function startSheet() {
  clearTimers(); resetTrace(); errors = 0; digitIdx = 0; sheetInk = {}; sheetCelebrated = false; page = 0; status = "idle";
  setMsg(sheetText());
  render();
}

// troca o nível de ajuda: no treino recomeça o número; na folha os já feitos continuam
function setLevel(l) {
  if (l === level || pointerId !== null) return;
  level = l;
  try { localStorage.setItem(LEVEL_KEY, l); } catch {}
  if (mode === "treino") { errors = 0; startTurn(); return; }
  clearTimers(); resetTrace(); status = "idle"; setMsg(sheetText()); render();
}

// troca entre números e letras e entra no modo escolhido (treino ou folha)
function setKind(k, m = mode) {
  if (k !== kind) {
    kind = k; T = SETS[k]; G = T.G; digitIdx = 0; layout = null; page = 0;
    try { localStorage.setItem(KIND_KEY, k); } catch {}
  }
  setMode(m);
}

// ----- tela inicial -----
// passo 1: números, minúsculas, maiúsculas (cursiva em breve); passo 2: treino ou folha
const KIND_NAMES = { numeros: "Números", letras: "Letras minúsculas", maiusculas: "Letras maiúsculas", cursiva: "Cursiva minúscula", cursivaMai: "Cursiva maiúscula", cursivaPal: "Palavras em cursiva", bastaoPal: "Palavras em letra bastão" };
const inHome = () => document.body.classList.contains("home");
function showHome(step = "kinds") {
  clearTimeout(leiTimer);
  clearTimers(); resetTrace(); demo = null; status = "idle";
  if (window.speechSynthesis) speechSynthesis.cancel();
  document.body.classList.remove("em-jogo");
  for (const id of ["jogo-pares", "jogo-bolinhas", "jogo-fono", "jogo-dois", "jogo-fala", "jogo-leitura"]) $(id).hidden = true;
  document.body.classList.remove("missao"); fonoMissao = false; try { fonoAudio && fonoAudio.pause(); } catch {} falaPara();
  document.body.classList.add("home");
  $("home").hidden = false;
  $("home-kinds").hidden = step !== "kinds";
  $("home-modes").hidden = step !== "modes";
  $("home-games").hidden = $("home-games-title").hidden = step !== "kinds";
  const title = step === "kinds" ? "Traçado" : KIND_NAMES[kind];
  $("title").textContent = title; document.title = step === "kinds" ? "Traçado de Números e Letras" : T.title;
  if (step === "kinds") { $("home-hello").textContent = "Oba! O que vamos traçar hoje?"; return; }
  $("home-hello").textContent = "Como você quer treinar?";
  const first = G.slice(0, 3).map(d => d.label);
  $("treino-glyph").textContent = first[0];
  $("folha-glyph").textContent = first.join(" ") + " …";
  $("folha-name").textContent = T.folha;
  for (const id of ["treino-glyph", "folha-glyph"]) $(id).classList.toggle("letra", kind !== "numeros");
}
function leaveHome(m) {
  document.body.classList.remove("home");
  $("home").hidden = true;
  setKind(kind, m);
}
document.querySelectorAll("#home-kinds [data-kind]").forEach(b => b.onclick = () => {
  const k = b.dataset.kind;
  if (k !== kind) { kind = k; T = SETS[k]; G = T.G; digitIdx = 0; layout = null; page = 0; try { localStorage.setItem(KIND_KEY, k); } catch {} }
  showHome("modes");
});
$("go-treino").onclick = () => leaveHome("treino");
$("go-folha").onclick = () => leaveHome("folha");
$("home-back").onclick = () => showHome("kinds");
$("home-btn").onclick = () => { if (pointerId === null) showHome("kinds"); };

// ----- jogos de números -----
const embaralha = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const lerJSON = (k, padrao) => { try { return JSON.parse(localStorage.getItem(k) || "null") ?? padrao; } catch { return padrao; } };
const gravarJSON = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
function abrirJogo(id, titulo) {
  clearTimers(); resetTrace();
  document.body.classList.remove("home"); $("home").hidden = true;
  document.body.classList.add("em-jogo");
  for (const j of ["jogo-pares", "jogo-bolinhas", "jogo-fono", "jogo-dois", "jogo-fala", "jogo-leitura"]) $(j).hidden = j !== id;
  $("title").textContent = titulo; document.title = titulo;
}

// Encontre os pares: números de 0 a 19 dos dois lados; achar todos os pares que somam o alvo (3 a 19).
// O par vale nos dois sentidos (2 + 9 é o mesmo par que 9 + 2).
const PARES_MIN = 3, PARES_MAX = 19, PARES_ATE = 19, PARES_KEY = "jogo-pares-feitos";
let paresAlvo = PARES_MIN, paresAchados = [], paresSel = { esq: null, dir: null };
let paresFeitos = new Set(lerJSON(PARES_KEY, []));
const paresDoAlvo = t => { const p = []; for (let a = 0; a <= Math.floor(t / 2); a++) if (t - a <= PARES_ATE) p.push([a, t - a]); return p; };
function paresNiveis() {
  const box = $("pares-niveis"); box.innerHTML = "";
  for (let t = PARES_MIN; t <= PARES_MAX; t++) {
    const b = document.createElement("button");
    b.textContent = t; b.setAttribute("aria-current", String(t === paresAlvo)); b.classList.toggle("feito", paresFeitos.has(t));
    b.setAttribute("aria-label", "Soma " + t + (paresFeitos.has(t) ? ", completa" : ""));
    b.onclick = () => paresComecar(t);
    box.appendChild(b);
  }
  box.querySelector('[aria-current="true"]')?.scrollIntoView({ inline: "center", block: "nearest" });
}
function paresComecar(t) {
  paresAlvo = t; paresAchados = []; paresSel = { esq: null, dir: null };
  $("pares-alvo").textContent = t; $("pares-lista").innerHTML = "";
  for (const lado of ["esq", "dir"]) {
    const col = $("pares-" + lado); col.innerHTML = "";
    embaralha([...Array(PARES_ATE + 1).keys()]).forEach(n => {
      const b = document.createElement("button");
      b.textContent = n; b.onclick = () => paresToque(lado, n, b);
      col.appendChild(b);
    });
  }
  paresNiveis(); paresProgresso();
  setMsg(`Toque um número de cada lado: a soma precisa dar ${t}`);
}
function paresProgresso() {
  const total = paresDoAlvo(paresAlvo).length;

// ----- caneta -----
// no livre a criança não vê a bolinha: um pouco mais de folga para encostar perto do começo
const tol = () => {
  const cursiva = G[digitIdx] && G[digitIdx].lined;
  const t = mode === "folha" ? (cursiva ? TOL_CURSIVA_FOLHA : TOL_FOLHA) : (cursiva ? TOL_CURSIVA_TREINO : TOL_TREINO);
  return livre() ? { ...t, start: t.start + 8 } : t;

// Na cursiva: se a caneta está bem mais perto de uma parte que ainda vem (o lado direito do "o" enquanto
// devia estar na entrada pelo lado esquerdo), esse trecho não faz o traço atual andar.
const pertoDe = (st, p) => { let m = Infinity; for (let k = 0; k < st.pts.length; k += 2) m = Math.min(m, dist(p, st.pts[k])); return m; };
const noTrechoQueVem = (d, st, p) => d.lined &&
  d.strokes.slice(strokeIdx + 1, strokeIdx + 3).some(o => !isTap(o) && pertoDe(o, p) + 8 < pertoDe(st, p));
const offset = () => mode === "folha" ? layout.cells[digitIdx] : { ox: 0, oy: 0 };

function toSvg(e) {

function fail(text) {

svg.addEventListener("pointerdown", e => {

// Traçado contínuo (letras com "cont"): terminado um traço, o aluno pode seguir sem tirar a caneta,
// voltando pela linha até a bolinha do próximo traço. Esse trecho de passagem não é conferido.
// O próximo traço começa quando a caneta está perto da bolinha dele (até 16) e já anda no sentido dele:
// no "a" depois de subir pela perninha e virar para baixo; no "n" ao subir e seguir para o arco.
function bridgeStep(p, lp) {
  const d = G[digitIdx], next = d.strokes[strokeIdx + 1];

  bridge.andou = (bridge.andou || 0) + moved;

svg.addEventListener("pointermove", e => {

function onUp(e) {

    b.classList.add("warn"); b.textContent = "Toque de novo para zerar";
    novoTimer = setTimeout(() => { b.classList.remove("warn"); b.textContent = "Novo aluno"; }, 3000);
    return;
  }
  clearTimeout(novoTimer); b.classList.remove("warn"); b.textContent = "Novo aluno";
  stars = {}; sheets = {}; save();
  paresFeitos = new Set(); bolMelhor = {}; fonoFeitos = new Set(); doisFeitos = new Set(); falaMelhor = {}; gravarJSON(FALA_KEY, {}); leiFeitos = new Set(); gravarJSON(LEI_KEY, []); gravarJSON(PARES_KEY, []); gravarJSON(BOL_KEY, {}); gravarJSON(FONO_KEY, []); gravarJSON(DOIS_KEY, []); // jogos também recomeçam
  if (!$("jogo-pares").hidden) paresNiveis();
  if (!$("bol-inicio").hidden) bolInicio();
  if (!$("jogo-leitura").hidden) leiGrupos();
  if (inHome() || document.body.classList.contains("em-jogo")) { b.textContent = "Zerado ✓"; novoTimer = setTimeout(() => { b.textContent = "Novo aluno"; }, 1500); return; }
  mode = "treino"; setMode("treino"); goTo(0);
};

let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  // o traço pela metade é refeito (as posições mudam); os já terminados continuam no lugar
  resizeTimer = setTimeout(() => {
    if (pointerId !== null || inHome()) return;
    if (mode === "folha") { layout = null; resetTrace(); render(); }
    else render(); // o quadro do treino muda ao girar o celular (o traço fica no lugar: está nas medidas da letra)
  }, 150);
});

// mantém a tela do tablet acesa enquanto o aluno treina
async function keepAwake() { try { await navigator.wakeLock.request("screen"); } catch {} }
keepAwake();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });

showHome("kinds");
</script>
<script>
// funciona sem internet depois da primeira visita, e o tablet recebe as atualizações sozinho
// App salvo na tela inicial não recarrega ao voltar para ele: ao reabrir procura versão nova e, quando ela chega,
// recarrega na tela inicial (nunca no meio de um traçado; se estiver traçando, espera voltar ao Início).
if ("serviceWorker" in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").then(reg => {
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); });
  }).catch(() => {}));
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController) return; // primeira visita: nada para trocar
    const reloadWhenHome = () => { if (inHome()) location.reload(); else setTimeout(reloadWhenHome, 2000); };
    reloadWhenHome();
  });
}
</script>
